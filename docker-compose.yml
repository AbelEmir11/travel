services:
  database:
    image: mysql:8.0
    container_name: travel-database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: travel_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./travel-backend
      dockerfile: Dockerfile
    container_name: travel-backend-api
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://root:rootpassword@database:3306/travel_db
      JWT_SECRET_KEY: travel-docker-jwt-key-super-secure-2026-vanguard
      SECRET_KEY: travel-docker-secret-key-super-secure-2026
    ports:
      - "5000:5000"
    depends_on:
      - database

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel-frontend-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
